name: ahram_reader
description: قارئ جريدة الأهرام
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  pdf: ^3.10.7
  printing: ^5.11.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  path_provider: ^2.1.2      # لحفظ الكوكيز وملفات الـ PDF
  flutter_pdfview: ^1.3.2    # لعرض الجريدة داخل التطبيق

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
