name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.ahram --project-name ahram_reader .

      - name: Patch AndroidManifest (Internet & Network)
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python3 <<'PY'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()

          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application')
              print("✅ Added INTERNET permission")

          if 'android:networkSecurityConfig' not in content:
              content = content.replace('<application', '<application\n        android:networkSecurityConfig="@xml/network_security_config"')
              print("✅ Linked network_security_config.xml")

          with open(path, 'w') as f:
              f.write(content)
          PY

      - name: Force Kotlin 2.0.10
        run: |
          python3 <<'PY'
          import re, pathlib
          path = pathlib.Path("android/settings.gradle")
          if not path.exists():
              raise SystemExit("settings.gradle not found")

          content = path.read_text()
          pattern = r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])'

          if re.search(pattern, content):
              content = re.sub(pattern, r'\g<1>2.0.10\g<2>', content)
              print("✅ Updated Kotlin version to 2.0.10")
          else:
              plugins_match = re.search(r'(plugins\s*\{)', content)
              if plugins_match:
                  insert_pos = plugins_match.end()
                  kotlin_line = '\n    id "org.jetbrains.kotlin.android" version "2.0.10" apply false'
                  content = content[:insert_pos] + kotlin_line + content[insert_pos:]
                  print("✅ Injected Kotlin plugin line")

          path.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ahram-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
