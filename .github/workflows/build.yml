name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.ahram --project-name ahram_reader .

      - name: Generate app icon
        run: |
          pip install Pillow
          mkdir -p assets
          python3 <<'PY'
          from PIL import Image, ImageDraw
          size = 1024
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([(0, 0), (size - 1, size - 1)], radius=230, fill=(211, 47, 47, 255))
          cx, cy = size // 2, size // 2 + 30
          draw.polygon([(cx - 380, cy - 140), (cx - 30, cy - 200), (cx - 30, cy + 280), (cx - 380, cy + 220)], fill=(255, 255, 255))
          draw.polygon([(cx + 30, cy - 200), (cx + 380, cy - 140), (cx + 380, cy + 220), (cx + 30, cy + 280)], fill=(255, 255, 255))
          for i in range(4):
              y = cy - 80 + i * 70
              draw.rounded_rectangle([(cx - 320, y), (cx - 90, y + 20)], radius=10, fill=(211, 47, 47, 255))
              draw.rounded_rectangle([(cx + 90, y), (cx + 320, y + 20)], radius=10, fill=(211, 47, 47, 255))
          draw.rectangle([(cx - 30, cy - 200), (cx + 30, cy + 280)], fill=(183, 28, 28, 255))
          img.save('assets/icon.png')
          print("✅ Icon saved")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: 🛠️ Upgrade Android SDK & Gradle for pdfview
        run: |
          echo "=== BEFORE ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          python3 <<'PY'
          import pathlib
          path = pathlib.Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not path.exists():
              raise SystemExit("❌ gradle-wrapper.properties not found")

          lines = path.read_text().splitlines()
          found = False
          new_lines = []
          for line in lines:
              if line.strip().startswith('distributionUrl'):
                  new_lines.append('distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip')
                  found = True
              else:
                  new_lines.append(line)

          if not found:
              new_lines.append('distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip')

          path.write_text('\n'.join(new_lines) + '\n')
          print("✅ Gradle wrapper updated to 8.7")
          PY

          python3 <<'PY'
          import re, pathlib
          path = pathlib.Path("android/app/build.gradle")
          if path.exists():
              content = path.read_text()
              content = re.sub(r'compileSdk(Version)?\s*[=:]?\s*\d+', 'compileSdk 35', content)
              content = re.sub(r'targetSdk(Version)?\s*[=:]?\s*\d+', 'targetSdk 35', content)
              path.write_text(content)
              print("✅ compileSdk & targetSdk = 35")
          PY

          python3 <<'PY'
          import re, pathlib
          path = pathlib.Path("android/settings.gradle")
          if path.exists():
              content = path.read_text()
              content = re.sub(
                  r'com\.android\.application["\']\s*\)?\s*version\s*["\'][^"\']+["\']',
                  'com.android.application" version "8.6.0"',
                  content
              )
              path.write_text(content)
              print("✅ AGP = 8.6.0")
          PY

          echo "=== AFTER ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          if grep -q "gradle-8.7" android/gradle/wrapper/gradle-wrapper.properties; then
            echo "✅ Gradle wrapper patched successfully"
          else
            echo "❌ Gradle wrapper patch FAILED"
            exit 1
          fi

      - name: Force Kotlin 2.0.10
        run: |
          python3 <<'PY'
          import re, pathlib
          path = pathlib.Path("android/settings.gradle")
          if path.exists():
              content = path.read_text()
              pattern = r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])'
              if re.search(pattern, content):
                  content = re.sub(pattern, r'\g<1>2.0.10\g<2>', content)
              else:
                  m = re.search(r'(plugins\s*\{)', content)
                  if m:
                      pos = m.end()
                      content = content[:pos] + '\n    id "org.jetbrains.kotlin.android" version "2.0.10" apply false' + content[pos:]
              path.write_text(content)
              print("✅ Kotlin updated to 2.0.10")
          PY

      - name: Patch AndroidManifest (Internet & Network)
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          python3 <<'PY'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application')
          if 'android:networkSecurityConfig' not in content:
              content = content.replace('<application', '<application\n        android:networkSecurityConfig="@xml/network_security_config"')
          with open(path, 'w') as f:
              f.write(content)
          PY

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ahram-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
