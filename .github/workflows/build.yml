name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload.keystore \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass ahram123 \
            -keypass ahram123 \
            -dname "CN=AhramReader, OU=Dev, O=Personal, L=Cairo, ST=Cairo, C=EG"

      - name: Configure signing
        run: |
          cat > android/key.properties <<EOF
          storePassword=ahram123
          keyPassword=ahram123
          keyAlias=upload
          storeFile=upload.keystore
          EOF

      - name: Patch build.gradle for signing
        run: |
          python3 - <<'PY'
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          # Add signing config before buildTypes
          signing_block = '''
              signingConfigs {
                  release {
                      keyAlias 'upload'
                      keyPassword 'ahram123'
                      storeFile file('upload.keystore')
                      storePassword 'ahram123'
                  }
              }
          '''
          content = content.replace('buildTypes {', signing_block + '\n    buildTypes {', 1)
          content = content.replace(
              'buildTypes {\n        release {',
              'buildTypes {\n        release {\n            signingConfig signingConfigs.release',
              1
          )
          with open(path, 'w') as f:
              f.write(content)
          print("Patched build.gradle")
          PY

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ahram-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
